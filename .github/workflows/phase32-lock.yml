name: Phase 32 Dependency Lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/phase32-lock.yml"

permissions:
  contents: write

jobs:
  lock-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "H2F Phase32 CI"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(phase32): lock production dependencies"
          git push origin HEAD:main

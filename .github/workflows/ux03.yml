name: UX-03 Industrial Library Schema
on:
  workflow_dispatch:
  push:
    branches: [ux-evolution]
    paths:
      - "src/editor-core/library.js"
      - "src/editor-core/inline-components.js"
      - "src/main.jsx"
      - "tests/ux03-library-schema.test.mjs"
      - "scripts/export-library-validation-matrix.mjs"
      - "package.json"
      - ".github/workflows/ux03.yml"
permissions:
  contents: read
jobs:
  library-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Full regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Export library validation matrix
        run: node scripts/export-library-validation-matrix.mjs artifacts/ux03-library-validation.json
      - name: Upload UX-03 evidence
        uses: actions/upload-artifact@v4
        with:
          name: H2F_ISO_INSPECT_UX03_LIBRARY_EVIDENCE
          path: artifacts/ux03-library-validation.json
          if-no-files-found: error
          retention-days: 30

name: UX-02 CAD Shell Acceptance
on:
  workflow_dispatch:
  push:
    branches: [ux-evolution]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.ux02.config.mjs"
      - ".github/workflows/ux02.yml"
permissions:
  contents: read
jobs:
  ux02:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Playwright runner
        run: npm install --no-save @playwright/test@1.55.1
      - name: UX-02 browser acceptance
        run: npx playwright test -c playwright.ux02.config.mjs
      - name: Assemble UX-02 local server
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          OUT="H2F_ISO_INSPECT_2.0_UX02_LOCAL_SERVER"
          rm -rf "$OUT"
          mkdir -p "$OUT"/{www,server,config,data,uploads,backups,logs,runtime}
          cp -a dist/. "$OUT/www/"
          cp local-server/server/H2F.LocalServer.ps1 "$OUT/server/"
          cp local-server/config/server.json "$OUT/config/"
          cp local-server/INICIAR_H2F_ISO_INSPECT.bat "$OUT/"
          cp local-server/PARAR_H2F_ISO_INSPECT.bat "$OUT/"
          cp local-server/ABRIR_H2F_ISO_INSPECT.bat "$OUT/"
          cp local-server/README_LOCAL.md "$OUT/LEIA_PRIMEIRO.md"
          cat > "$OUT/VERSION.json" <<EOF
          {
            "product": "H2F ISO INSPECT 2.0",
            "cycle": "UX/UI Industrial",
            "phase": "UX-02",
            "packageVersion": "0.32.0",
            "branch": "ux-evolution",
            "commit": "${GITHUB_SHA}",
            "distribution": "LOCAL_SERVER_WINDOWS"
          }
          EOF
          zip -qr "${OUT}.zip" "$OUT"

      - name: Upload UX-02 local server
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: H2F_ISO_INSPECT_2.0_UX02_LOCAL_SERVER
          path: H2F_ISO_INSPECT_2.0_UX02_LOCAL_SERVER.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload UX-02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H2F_ISO_INSPECT_UX02_EVIDENCE
          path: |
            playwright-report-ux02
            test-results
          if-no-files-found: warn
          retention-days: 30

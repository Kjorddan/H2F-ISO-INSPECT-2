name: UX-05 Instruments Supports Equipment
on:
  workflow_dispatch:
  push:
    branches: [ux-evolution]
    paths:
      - 'src/**'
      - 'tests/ux05-instrument-support-equipment.test.mjs'
      - 'tests/browser/ux05.spec.mjs'
      - 'playwright.ux05.config.mjs'
      - 'package.json'
      - '.github/workflows/ux05.yml'
permissions:
  contents: read
jobs:
  ux05:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Full regression and UX-05 core
        run: npm test
      - name: Build Vite
        run: npm run build
      - name: Playwright runner
        run: npm install --no-save @playwright/test@1.55.1
      - name: UX-05 Chromium
        run: npx playwright test -c playwright.ux05.config.mjs
      - name: Assemble UX-05 Windows Local Server
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          OUT="H2F_ISO_INSPECT_2.0_UX05_LOCAL_SERVER"
          rm -rf "$OUT"
          mkdir -p "$OUT"/{www,server,config,data,uploads,backups,logs,runtime}
          cp -a dist/. "$OUT/www/"
          cp local-server/server/H2F.LocalServer.ps1 "$OUT/server/"
          cp local-server/config/server.json "$OUT/config/"
          cp local-server/INICIAR_H2F_ISO_INSPECT.bat "$OUT/"
          cp local-server/PARAR_H2F_ISO_INSPECT.bat "$OUT/"
          cp local-server/ABRIR_H2F_ISO_INSPECT.bat "$OUT/"
          cp local-server/README_LOCAL.md "$OUT/LEIA_PRIMEIRO.md"
          cat > "$OUT/VERSION.json" <<EOF
          {"product":"H2F ISO INSPECT 2.0","phase":"UX-05","branch":"ux-evolution","commit":"${GITHUB_SHA}","distribution":"LOCAL_SERVER_WINDOWS"}
          EOF
          zip -qr "${OUT}.zip" "$OUT"
      - name: Upload Local Server
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: H2F_ISO_INSPECT_2.0_UX05_LOCAL_SERVER
          path: H2F_ISO_INSPECT_2.0_UX05_LOCAL_SERVER.zip
          if-no-files-found: error
          retention-days: 30
      - name: Package UX-05 complete tracked source
        if: success()
        run: git archive --format=zip --output H2F_ISO_INSPECT_2.0_UX05_SOURCE.zip HEAD
      - name: Upload UX-05 source package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: H2F_ISO_INSPECT_2.0_UX05_SOURCE
          path: H2F_ISO_INSPECT_2.0_UX05_SOURCE.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H2F_ISO_INSPECT_UX05_EVIDENCE
          path: |
            playwright-report-ux05
            test-results
          if-no-files-found: warn
          retention-days: 30
